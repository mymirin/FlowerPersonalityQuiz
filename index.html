<!doctype html>
<html lang="th">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
        <title>คุณคือดอกไม้อะไร?</title>
        <meta name="description" content="แบบทดสอบ 10 ข้อ ค้นหาดอกไม้ที่สะท้อนตัวตนของคุณ" />
        <meta property="og:title" content="คุณคือดอกไม้อะไร?" />
        <meta property="og:description" content="แบบทดสอบ 10 ข้อ ค้นหาดอกไม้ที่สะท้อนตัวตนของคุณ" />
        <meta property="og:type" content="website" />
        <meta name="theme-color" content="#FFF0F4" />
        <meta name="color-scheme" content="light only" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap"
        />
        <style>
            :root {
                color-scheme: light only;
                --bg1: #fff0f4;
                --bg2: #fff9f5;
                --tx: #a85b72;
                --tx2: #c98fa1;
                --tx3: #ddb4c0;
                --ac: #f49bb4;
                --sel: #c4708c;
                --cd: #ffffff;
                --cdl: #fbe0e9;
                --sh: 0 10px 26px -14px rgba(168, 91, 114, 0.45);
                --sh-b: 0 10px 22px -10px rgba(196, 112, 140, 0.55);
            }
            * {
                box-sizing: border-box;
                -webkit-tap-highlight-color: transparent;
            }
            /* ไม่ให้แตะสองครั้งแล้วซูม (แต่ยังหุบ/กางสองนิ้วซูมได้ตามปกติ) */
            html,
            body,
            button,
            a,
            input {
                touch-action: manipulation;
            }
            html,
            body {
                margin: 0;
                padding: 0;
            }
            body {
                background: linear-gradient(170deg, var(--bg1) 0%, var(--bg2) 62%, var(--bg1) 100%);
                background-attachment: fixed;
                color: var(--tx);
                font-family:
                    "IBM Plex Sans Thai",
                    system-ui,
                    -apple-system,
                    sans-serif;
                font-size: 16.5px;
                line-height: 1.85;
                -webkit-font-smoothing: antialiased;
                min-height: 100svh;
                display: flex;
                flex-direction: column;
                position: relative;
                overflow-x: hidden;
            }
            * {
                -webkit-user-drag: none;
                user-select: none;
                -moz-user-select: none;
                -webkit-user-select: none;
                -ms-user-select: none;
            }

            /* ---------- floating petals ---------- */
            .petals {
                position: fixed;
                inset: 0;
                pointer-events: none;
                z-index: 0;
                overflow: hidden;
            }
            .pt {
                position: absolute;
                border-radius: 62% 0 62% 0;
                background: var(--cdl);
                opacity: 0.75;
                animation: drift 14s ease-in-out infinite;
            }
            .pt.b {
                background: #fde7d8;
                opacity: 0.6;
            }
            .pt.c {
                background: #f6e2ec;
                opacity: 0.7;
            }
            @keyframes drift {
                0%,
                100% {
                    transform: translate3d(0, 0, 0) rotate(var(--r, 20deg));
                }
                50% {
                    transform: translate3d(0, -16px, 0) rotate(calc(var(--r, 20deg) + 12deg));
                }
            }
            @media (prefers-reduced-motion: reduce) {
                .pt {
                    animation: none;
                }
            }

            .shell {
                width: 100%;
                max-width: 470px;
                margin: 0 auto;
                padding: 0 22px;
                flex: 1;
                display: flex;
                flex-direction: column;
                position: relative;
                z-index: 1;
            }

            /* ---------- top ---------- */
            .top {
                display: flex;
                justify-content: flex-end;
                padding: 15px 0 2px;
                min-height: 52px;
            }
            .lang {
                display: inline-flex;
                border: 1px solid var(--cdl);
                border-radius: 999px;
                overflow: hidden;
                background: rgba(255, 255, 255, 0.75);
                backdrop-filter: blur(6px);
            }
            .lang button {
                border: 0;
                background: transparent;
                font-family: inherit;
                font-size: 12px;
                font-weight: 500;
                letter-spacing: 0.06em;
                color: var(--tx2);
                padding: 5px 13px;
                cursor: pointer;
                transition: 0.18s;
            }
            .lang button[aria-pressed="true"] {
                background: var(--sel);
                color: #fff;
            }
            .lang button:focus-visible {
                outline: 2px solid var(--ac);
                outline-offset: -2px;
            }

            /* ---------- screens ---------- */
            .screen {
                display: none;
                flex: 1;
                flex-direction: column;
                padding-bottom: 38px;
            }
            .screen.on {
                display: flex;
            }

            /* ---------- buttons ---------- */
            .btn {
                font-family: "IBM Plex Sans Thai", sans-serif;
                font-size: 16px;
                font-weight: 500;
                border-radius: 999px;
                padding: 14px 34px;
                cursor: pointer;
                border: 1px solid transparent;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                transition:
                    transform 0.16s,
                    box-shadow 0.16s,
                    filter 0.16s,
                    background 0.16s,
                    color 0.16s;
            }
            .btn:active {
                transform: scale(0.96);
            }
            .btn:focus-visible {
                outline: 2px solid var(--ac);
                outline-offset: 3px;
            }
            .btn-main {
                background: linear-gradient(135deg, #d687a0, #c4708c);
                color: #fff;
                box-shadow: var(--sh-b);
            }
            .btn-main:hover {
                filter: brightness(1.06);
            }
            .btn-ghost {
                background: var(--cd);
                color: var(--tx);
                border-color: var(--cdl);
                box-shadow: var(--sh);
            }
            .btn-ghost:hover {
                border-color: var(--ac);
            }
            .btn-text {
                background: none;
                border: 0;
                color: var(--tx3);
                font-size: 13.5px;
                padding: 9px 10px;
                cursor: pointer;
                font-family: inherit;
                border-radius: 8px;
            }
            .btn-text:hover {
                color: var(--tx);
            }
            .btn-text:focus-visible {
                outline: 2px solid var(--ac);
                outline-offset: 2px;
            }

            /* ---------- intro (pages 1–5) ---------- */
            #s-intro {
                justify-content: center;
                text-align: center;
                padding-top: 4px;
            }
            .slide {
                display: none;
                flex-direction: column;
                align-items: center;
                animation: soft 0.5s ease both;
            }
            .slide.on {
                display: flex;
            }
            @keyframes soft {
                from {
                    opacity: 0;
                    transform: translateY(10px);
                }
                to {
                    opacity: 1;
                    transform: none;
                }
            }
            @media (prefers-reduced-motion: reduce) {
                .slide {
                    animation: none;
                }
            }
            .emo {
                font-size: 31px;
                line-height: 1;
                margin-bottom: 16px;
                filter: drop-shadow(0 4px 8px rgba(168, 91, 114, 0.18));
            }
            .emo svg {
                width: 54px;
                height: 54px;
                display: block;
                margin: 0 auto;
                animation: bob 3.6s ease-in-out infinite;
            }
            @keyframes bob {
                0%,
                100% {
                    transform: translateY(0);
                }
                50% {
                    transform: translateY(-3.5px);
                }
            }
            .ico-in {
                display: inline-block;
                width: 23px;
                height: 23px;
                vertical-align: -5px;
            }
            .ico-in svg {
                width: 100%;
                height: 100%;
                display: block;
            }
            @media (prefers-reduced-motion: reduce) {
                .emo svg {
                    animation: none;
                }
            }
            .k {
                color: var(--tx2);
                font-size: 15px;
                margin: 0 0 12px;
            }
            .big {
                font-family: Mitr, sans-serif;
                font-weight: 300;
                font-size: clamp(21px, 5.9vw, 26px);
                line-height: 1.62;
                margin: 0;
                text-wrap: balance;
                color: var(--tx);
            }
            .big em {
                font-style: normal;
                font-weight: 400;
            }
            .big small {
                font-size: 0.72em;
            }
            /* หน้าคั่น 1 — ย่อลงเล็กน้อยให้พอดี 2 บรรทัด */
            #pre1big {
                font-size: clamp(18px, 5.2vw, 23px);
            }
            .rule {
                width: 44px;
                height: 1px;
                background: var(--cdl);
                margin: 22px 0 0;
            }
            .after {
                color: var(--tx2);
                font-size: 15px;
                margin: 16px 0 0;
            }
            .gobox {
                margin-top: 36px;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 4px;
            }
            #next {
                font-size: 13.5px;
                font-weight: 500;
                padding: 11px 26px;
            }
            .dots {
                display: flex;
                gap: 7px;
                justify-content: center;
                margin-top: 26px;
            }
            /* ---------- หน้าคั่นก่อนผลลัพธ์ ---------- */
            .il {
                justify-content: center;
                text-align: center;
                align-items: center;
                padding-top: 4px;
            }
            .il .after {
                font-size: 15.5px;
                line-height: 1.9;
                color: var(--tx2);
            }
            #pre1next,
            #pre2after {
                font-size: 13.5px;
                font-weight: 500;
                padding: 11px 26px;
            }
            #pre2after .ico-in {
                width: 19px;
                height: 19px;
                vertical-align: -3px;
                margin-left: 2px;
            }
            .dot {
                width: 6px;
                height: 6px;
                border-radius: 50%;
                background: var(--cdl);
                transition: 0.25s;
            }
            .dot.on {
                background: var(--ac);
                transform: scale(1.35);
            }

            /* ---------- quiz ---------- */
            #s-quiz {
                padding-top: 4px;
            }
            .prog {
                display: flex;
                flex-direction: column;
                gap: 8px;
                margin-bottom: 30px;
            }
            .prog .row {
                display: flex;
                justify-content: space-between;
                font-size: 12px;
                letter-spacing: 0.05em;
                color: var(--tx2);
            }
            .prog .track {
                height: 4px;
                border-radius: 99px;
                background: var(--cdl);
                overflow: hidden;
            }
            .prog .fill {
                height: 100%;
                border-radius: 99px;
                background: linear-gradient(90deg, #f7b6c8, var(--ac));
                transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            }
            .qtext {
                font-family: Mitr, sans-serif;
                font-weight: 500;
                font-size: clamp(19px, 5.2vw, 22px);
                line-height: 1.6;
                margin: auto 0 24px;
                text-wrap: balance;
                min-height: 2.1em;
                color: var(--tx);
            }
            .opts {
                display: flex;
                flex-direction: column;
                gap: 11px;
            }
            .opt {
                width: 100%;
                text-align: left;
                background: var(--cd);
                border: 1px solid var(--cdl);
                border-radius: 18px;
                padding: 15px 19px;
                font-family: inherit;
                font-size: 15.5px;
                line-height: 1.6;
                color: var(--tx);
                cursor: pointer;
                transition: 0.18s;
                box-shadow: var(--sh);
            }
            .opt:hover {
                border-color: var(--ac);
            }
            .opt:active {
                transform: scale(0.985);
            }
            .opt:focus-visible {
                outline: 2px solid var(--ac);
                outline-offset: 2px;
            }
            .opt.picked {
                background: linear-gradient(135deg, #d687a0, #c4708c);
                border-color: transparent;
                color: #fff;
                box-shadow: var(--sh-b);
            }
            .qfoot {
                margin-top: auto;
                padding-top: 26px;
                padding-bottom: 4px;
                display: flex;
                justify-content: center;
            }

            /* ---------- result ---------- */
            #s-result {
                align-items: center;
                text-align: center;
                padding-top: 2px;
            }
            .bloom {
                width: min(72vw, 262px);
                aspect-ratio: 1;
                margin: 4px 0 2px;
            }
            .bloom svg {
                width: 100%;
                height: 100%;
                display: block;
                animation: rise 0.85s cubic-bezier(0.2, 0.9, 0.25, 1) both;
            }
            @keyframes rise {
                from {
                    opacity: 0;
                    transform: translateY(16px) scale(0.95);
                }
                to {
                    opacity: 1;
                    transform: none;
                }
            }
            @media (prefers-reduced-motion: reduce) {
                .bloom svg {
                    animation: none;
                }
            }
            .r-th {
                font-family: Mitr, sans-serif;
                font-weight: 600;
                font-size: clamp(29px, 8.4vw, 37px);
                line-height: 1.4;
                margin: 0;
                color: var(--tx);
            }
            .r-en {
                font-size: 11.5px;
                letter-spacing: 0.24em;
                text-transform: uppercase;
                color: var(--tx3);
                margin: 3px 0 20px;
            }
            .poem {
                display: flex;
                flex-direction: column;
                gap: 2px;
                font-size: 15.5px;
                line-height: 1.95;
                margin: 0 0 22px;
                color: var(--tx);
            }
            .r-card {
                background: var(--cd);
                border: 1px solid var(--cdl);
                border-radius: 20px;
                padding: 18px 20px;
                color: var(--tx2);
                font-size: 14.5px;
                line-height: 1.85;
                text-align: left;
                margin-bottom: 22px;
                width: 100%;
                box-shadow: var(--sh);
            }
            .actions {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 10px;
                width: 100%;
            }
            .actions .btn {
                width: 100%;
                padding: 10px 10px;
                font-size: 13.5px;
            }
            .actions .wide {
                grid-column: 1 / -1;
            }
            /* ---------- คำคติท้ายหน้าผลลัพธ์ ---------- */
            .quote {
                width: 100%;
                margin-top: 30px;
                padding-top: 26px;
                border-top: 1px solid var(--cdl);
                font-family: Mitr, sans-serif;
                font-weight: 300;
                font-size: 13.5px;
                line-height: 2.05;
                color: var(--tx3);
                text-align: center;
            }
            .quote .qm {
                display: block;
                font-size: 14.5px;
                color: var(--tx2);
                margin-bottom: 16px;
                font-style: italic;
            }
            .quote .qe {
                display: block;
                font-size: 14.5px;
                color: var(--tx2);
                margin-top: 16px;
                font-style: italic;
            }
            .credit {
                margin-top: 26px;
                padding-top: 20px;
                border-top: 1px solid var(--cdl);
                width: 100%;
                display: flex;
                flex-direction: column;
                gap: 9px;
                align-items: center;
            }
            .credit .by {
                font-family: Mitr, sans-serif;
                font-weight: 400;
                font-size: 12.5px;
                color: var(--tx3);
                letter-spacing: 0.14em;
            }
            .credit .mail {
                margin-top: -6px;
                font-size: 11px;
                letter-spacing: 0.02em;
                color: var(--tx3);
                text-decoration: none;
                border-bottom: 1px solid transparent;
                transition:
                    color 0.16s,
                    border-color 0.16s;
            }
            @media (hover: hover) {
                .credit .mail:hover {
                    color: var(--tx2);
                    border-bottom-color: #efc9d5;
                }
            }
            .credit .note {
                font-size: 11.5px;
                line-height: 1.7;
                color: var(--tx3);
                max-width: 34ch;
            }

            /* ---------- gallery ---------- */
            #s-all {
                padding-top: 2px;
            }
            .g-head {
                text-align: center;
                margin-bottom: 22px;
            }
            .g-head h2 {
                font-family: Mitr, sans-serif;
                font-weight: 500;
                font-size: 24px;
                margin: 0 0 5px;
                color: var(--tx);
            }
            .g-head p {
                margin: 0;
                color: var(--tx2);
                font-size: 14.5px;
            }
            .grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }
            .gcard {
                background: var(--cd);
                border: 1px solid var(--cdl);
                border-radius: 20px;
                padding: 13px 11px 16px;
                text-align: center;
                cursor: pointer;
                font-family: inherit;
                transition: 0.18s;
                box-shadow: var(--sh);
            }
            .gcard:hover {
                border-color: var(--ac);
            }
            .gcard:focus-visible {
                outline: 2px solid var(--ac);
                outline-offset: 2px;
            }
            .gcard svg {
                width: 78%;
                aspect-ratio: 1;
                display: block;
                margin: 0 auto 6px;
            }
            .gcard .n {
                font-family: Mitr, sans-serif;
                font-weight: 500;
                font-size: 16px;
                color: var(--tx);
                line-height: 1.4;
            }
            .gcard .e {
                font-size: 9.5px;
                letter-spacing: 0.15em;
                text-transform: uppercase;
                color: var(--tx3);
                margin-top: 2px;
            }
            .gcard .d {
                font-size: 12.5px;
                line-height: 1.7;
                color: var(--tx2);
                margin-top: 8px;
                display: none;
                text-align: left;
            }
            .gcard.open {
                grid-column: 1 / -1;
                cursor: default;
            }
            .gcard.open svg {
                width: 38%;
            }
            .gcard.open .d {
                display: block;
            }
            .closing {
                margin: 32px 0 6px;
                text-align: center;
                color: var(--tx2);
                font-size: 15px;
                line-height: 1.95;
            }
            .closing b {
                color: var(--tx);
                font-family: Mitr, sans-serif;
                font-weight: 500;
                font-size: 18px;
                display: block;
                margin: 12px 0 8px;
            }
            .g-foot {
                display: flex;
                justify-content: center;
                padding-top: 22px;
            }

            /* ---------- ดอกไม้ที่เข้ากัน ---------- */
            .match {
                width: 100%;
                margin: 0 0 22px;
            }
            .match .mt {
                font-family: Mitr, sans-serif;
                font-weight: 500;
                font-size: 16px;
                line-height: 1.5;
                color: var(--tx);
                text-align: center;
                margin: 0 0 11px;
            }
            .mrow {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }
            .mc {
                background: var(--cd);
                border: 1px solid var(--cdl);
                border-radius: 18px;
                padding: 13px 11px 15px;
                text-align: center;
                box-shadow: var(--sh);
            }
            .mc svg {
                width: 58px;
                aspect-ratio: 1;
                display: block;
                margin: 0 auto 5px;
            }
            .mc .n {
                font-family: Mitr, sans-serif;
                font-weight: 500;
                font-size: 15px;
                color: var(--tx);
                line-height: 1.4;
            }
            .mc .e {
                font-size: 8.5px;
                letter-spacing: 0.15em;
                text-transform: uppercase;
                color: var(--tx3);
                margin-top: 2px;
            }
            .mc .r {
                font-size: 12px;
                line-height: 1.7;
                color: var(--tx2);
                margin-top: 8px;
            }
            .mc.diff {
                grid-column: 1 / -1;
                display: flex;
                align-items: center;
                gap: 13px;
                text-align: left;
                border-style: dashed;
            }
            .mc.diff svg {
                width: 52px;
                margin: 0;
                flex: 0 0 auto;
            }
            .mc.diff .lbl {
                font-size: 8.5px;
                letter-spacing: 0.16em;
                text-transform: uppercase;
                color: var(--tx3);
                margin-bottom: 3px;
            }
            .mc.diff .r {
                margin-top: 5px;
            }

            /* ---------- ดอกไม้ทั้ง 10 ท้ายหน้าผลลัพธ์ ---------- */
            .r-all {
                width: 100%;
                margin-top: 30px;
                padding-top: 26px;
                border-top: 1px solid var(--cdl);
            }
            .r-all .t {
                font-family: Mitr, sans-serif;
                font-weight: 500;
                font-size: 19px;
                line-height: 1.5;
                margin: 0 0 4px;
                color: var(--tx);
                text-align: center;
            }
            .r-all .s {
                margin: 0 0 16px;
                font-size: 12.5px;
                line-height: 1.7;
                color: var(--tx3);
                text-align: center;
            }

            /* ---------- save overlay ---------- */
            .ov {
                position: fixed;
                inset: 0;
                background: rgba(120, 66, 84, 0.72);
                backdrop-filter: blur(5px);
                display: none;
                align-items: center;
                justify-content: center;
                padding: 22px;
                z-index: 50;
                overflow-y: auto;
                overscroll-behavior: contain;
                -webkit-overflow-scrolling: touch;
            }
            .ov.on {
                display: flex;
            }
            .ov-in {
                max-width: 330px;
                width: 100%;
                margin: auto;
                display: flex;
                flex-direction: column;
                gap: 14px;
                align-items: center;
                text-align: center;
            }
            .ov img {
                width: auto;
                max-width: 100%;
                max-height: 62vh; /* fallback สำหรับ iOS ที่เก่ากว่า 15.4 */
                max-height: 62svh;
                border-radius: 16px;
                box-shadow: 0 20px 50px -18px rgba(0, 0, 0, 0.55);
                display: block;
                margin: 0 auto;
                object-fit: contain;
            }
            .ov p {
                margin: 0;
                color: #fff0f4;
                font-size: 13.5px;
                text-align: center;
                line-height: 1.7;
            }
            .ov .btn {
                width: 100%;
            }
            /* ---------- ปุ่ม + หน้าสนับสนุนอาหารแมว ---------- */
            .cat-btn {

            /* ---------- scoring ---------- */
            function score() {
                const tot = {},
                    late = {},
                    last = {};
                DATA.flowers.forEach((f) => {
                    tot[f.id] = late[f.id] = last[f.id] = 0;
                });
                answers.forEach((oi, i) => {
                    const s = DATA.questions[i].options[oi].s;
                    for (const k in s) {
                        tot[k] += s[k];
                        if (i >= 7) late[k] += s[k];
                        if (i === 9) last[k] += s[k];
                    }
                });
                return DATA.flowers
                    .map((f) => f.id)
                    .sort(
                        (a, b) => tot[b] - tot[a] || late[b] - late[a] || last[b] - last[a] || TIEBREAK.indexOf(a) - TIEBREAK.indexOf(b),
                    )[0];
            }

            /* ---------- font + text-fitting helpers (iOS-safe) ----------
               iOS Safari ใช้เว็บฟอนต์ใน <canvas> ไม่ได้ ถ้าฟอนต์นั้นยังไม่เคยถูกใช้
               จัดหน้าใน DOM มาก่อน และ Google Fonts แยก @font-face ตาม unicode-range
               (ละติน/ไทยคนละไฟล์) ทำให้ document.fonts.load() แบบไม่ส่งข้อความตัวอย่าง
               จะโหลดมาแค่ชุดละติน — ตัวไทยจึงตกไปใช้ฟอนต์ระบบและความกว้างเพี้ยน */
            const CARD_SAMPLE = "กุหลาบทิวลิปเดซี่ ปั้น ๆ ก้ำกึ่ง ABCabc0123 —…";
            const CARD_FONTS = [
                ["600", 92, "Mitr, sans-serif"],
                ["500", 33, "Mitr, sans-serif"],
                ["500", 32, "Mitr, sans-serif"],
                ["400", 25, "Mitr, sans-serif"],
                ["400", 42, "'IBM Plex Sans Thai', sans-serif"],
                ["500", 27, "'IBM Plex Sans Thai', sans-serif"],
                ["500", 21, "'IBM Plex Sans Thai', sans-serif"],
                ["400", 27, "'IBM Plex Sans Thai', sans-serif"],
            ];
            let _fontsWarm = null;
            function warmCardFonts() {
                if (_fontsWarm) return _fontsWarm;
                _fontsWarm = (async function () {
                    const warm = document.createElement("div");
                    warm.setAttribute("aria-hidden", "true");
                    warm.style.cssText = "position:absolute;left:-99999px;top:-99999px;white-space:nowrap;pointer-events:none;";
                    CARD_FONTS.forEach(function (fx) {
                        const sp = document.createElement("span");
                        sp.style.cssText = "font-family:" + fx[2] + ";font-weight:" + fx[0] + ";font-size:" + fx[1] + "px;";
                        sp.textContent = CARD_SAMPLE;
                        warm.appendChild(sp);
                    });
                    document.body.appendChild(warm);
                    void warm.offsetWidth; /* บังคับให้เกิด layout จริง */
                    try {
                        await Promise.all(
                            CARD_FONTS.map(function (fx) {
                                return document.fonts.load(fx[0] + " " + fx[1] + "px " + fx[2], CARD_SAMPLE);
                            }),
                        );
                        await Promise.race([
                            document.fonts.ready,
                            new Promise(function (r) {
                                setTimeout(r, 4000);
                            }),
                        ]);
                    } catch (e) {}
                    await new Promise(function (r) {
                        requestAnimationFrame(function () {
                            requestAnimationFrame(r);
                        });
                    });
                    warm.remove();
                })();
                return _fontsWarm;
            }
            /* วัดความกว้างข้อความด้วย DOM
               บน iOS Safari canvas.measureText() คืนค่า 0 สำหรับข้อความไทย เมื่อฟอนต์
               มาจาก @font-face ที่ Google Fonts แบ่งตาม unicode-range — ตัวอักษรถูกวาด
               ออกมาถูกต้อง แต่ความกว้างเป็น 0 ทำให้ textAlign:"center" ไม่ขยับอะไรเลย
               ข้อความไทยจึงไปเริ่มที่จุดกึ่งกลางแล้วล้นออกขวา ส่วนข้อความละตินยังตรงอยู่
               การวัดผ่าน DOM ใช้ font cascade ชุดเดียวกับที่หน้าเว็บใช้จัดหน้า จึงเชื่อถือได้ */
            let _ruler = null;
            function measureDOM(text, weight, size, family) {
                if (!_ruler) {
                    _ruler = document.createElement("span");
                    _ruler.setAttribute("aria-hidden", "true");
                    _ruler.style.cssText = "position:absolute;left:-99999px;top:-99999px;white-space:pre;visibility:hidden;";
                    document.body.appendChild(_ruler);
                }
                _ruler.style.font = weight + " " + size + "px " + family;
                _ruler.textContent = text;
                return _ruler.getBoundingClientRect().width;
            }
            /* ความกว้างที่เชื่อถือได้ = ค่ามากสุดของ DOM กับ canvas (ตัวไหนพังจะได้ 0) */
            function textW(c, text, weight, size, family) {
                return Math.max(measureDOM(text, weight, size, family), c.measureText(text).width || 0);
            }
            /* ย่อขนาดฟอนต์จนกว้างไม่เกิน maxW แล้ววาดโดยจัดกึ่งกลางที่ cx ด้วยตัวเอง
               (ไม่พึ่ง textAlign ของ canvas ซึ่งพังบน iOS) */
            function fillFit(c, text, cx, y, maxW, weight, size, family) {
                let s = size;
                c.font = weight + " " + s + "px " + family;
                let w = textW(c, text, weight, s, family);
                const min = Math.floor(size * 0.5);
                if (w > maxW && w > 0) {
                    s = Math.max(min, Math.floor((s * maxW) / w));
                    c.font = weight + " " + s + "px " + family;
                    w = textW(c, text, weight, s, family);
                    while (w > maxW && s > min) {
                        s -= 1;
                        c.font = weight + " " + s + "px " + family;
                        w = textW(c, text, weight, s, family);
                    }
                }
                c.fillText(text, Math.round(cx - w / 2), y);
                return s;
            }

            async function buildCard(id) {
                const f = F(id),
                    th = lang === "th";
                const cv = document.createElement("canvas");
                cv.width = CARD.w;
                cv.height = CARD.h;
                const c = cv.getContext("2d");
                await warmCardFonts();

                const g = c.createLinearGradient(0, 0, 0, CARD.h);
                g.addColorStop(0, "#FFF0F4");
                g.addColorStop(0.6, "#FFF9F5");
                g.addColorStop(1, "#FFF0F4");
                c.fillStyle = g;
                c.fillRect(0, 0, CARD.w, CARD.h);

                c.save();
                [
                    [130, 250, 54, 0.55],
                    [930, 430, 34, 0.5],
                    [170, 1520, 44, 0.45],
                    [900, 1650, 64, 0.4],
                    [880, 180, 26, 0.5],
                ].forEach(function (p) {
                    c.globalAlpha = p[3];
                    c.fillStyle = "#FBE0E9";
                    c.beginPath();
                    c.ellipse(p[0], p[1], p[2], p[2] * 0.72, Math.PI / 5, 0, Math.PI * 2);
                    c.fill();
                });
                c.restore();

                const img = await loadImg(flowerURL(id));
                const S = 400;
                c.drawImage(img, (CARD.w - S) / 2, 120, S, S);

                /* วาดแบบชิดซ้ายเสมอ แล้วคำนวณจุดกึ่งกลางเองใน fillFit
                   เพราะ textAlign:"center" ของ canvas ใช้กับข้อความไทยไม่ได้บน iOS Safari */
                c.textAlign = "left";
                c.fillStyle = "#A85B72";
                fillFit(c, th ? f.th : f.enName, CARD.w / 2, 620, 860, "600", 92, "Mitr, sans-serif");

                c.fillStyle = "#DDB4C0";
                fillFit(c, spaced(f.en.toUpperCase()), CARD.w / 2, 680, 900, "500", 27, "'IBM Plex Sans Thai', sans-serif");

                c.strokeStyle = "#FBE0E9";
                c.lineWidth = 3;
                c.beginPath();
                c.moveTo(CARD.w / 2 - 80, 736);
                c.lineTo(CARD.w / 2 + 80, 736);
                c.stroke();

                c.fillStyle = "#A85B72";
                (th ? f.poem : f.poemEn).forEach(function (l, i) {
                    fillFit(c, l, CARD.w / 2, 840 + i * 84, 920, "400", 42, "'IBM Plex Sans Thai', sans-serif");
                });

                /* ---- ดอกไม้ที่เข้ากับคุณ / ต่างขั้ว ---- */
                const m = MATCH[id];
                if (m) {
                    const t = T();
                    c.fillStyle = "#C98FA1";
                    fillFit(c, t.cardMatch, CARD.w / 2, 1230, 900, "500", 32, "Mitr, sans-serif");

                    const list = [
                        [m.ok[0][0], t.tagOk],
                        [m.ok[1][0], t.tagOk],
                        [m.no[0], t.tagNo],
                    ];
                    const xs = [250, 540, 830],
                        IS = 150;
                    const ims = await Promise.all(
                        list.map(function (o) {
                            return loadImg(flowerURL(o[0], IS));
                        }),
                    );
                    list.forEach(function (o, i) {
                        const mf = F(o[0]);
                        c.drawImage(ims[i], xs[i] - IS / 2, 1276, IS, IS);
                        c.fillStyle = "#A85B72";
                        fillFit(c, th ? mf.th : mf.enName, xs[i], 1490, 262, "500", 33, "Mitr, sans-serif");
                        c.fillStyle = i === 2 ? "#CDA7BC" : "#DDB4C0";
                        fillFit(c, th ? o[1] : spaced(o[1]), xs[i], 1538, 262, "500", 21, "'IBM Plex Sans Thai', sans-serif");
                    });
                }

                c.fillStyle = "#C98FA1";
                fillFit(c, T().cardFoot, CARD.w / 2, 1670, 900, "400", 27, "'IBM Plex Sans Thai', sans-serif");
                c.fillStyle = "#DDB4C0";
                fillFit(c, spaced("By JUPU"), CARD.w / 2, 1740, 900, "400", 25, "Mitr, sans-serif");

                return cv.toDataURL("image/png");
            }

            });
            $("#share").addEventListener("click", async function () {
                const url = location.origin + location.pathname;
                try {
                    if (navigator.share) {
                        await navigator.share({ title: document.title, text: T().shareText, url });
                        return;
                    }
                    await navigator.clipboard.writeText(url);
                    toast(T().copied);
                } catch (e) {}
            });
            $("#save").addEventListener("click", async function () {
                toast(T().saving);
                try {
                    const url = await buildCard(result);
                    const a = document.createElement("a");
                    a.href = url;
                    a.download = "flower-" + result + ".png";
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    $("#ovimg").src = url;
                    $("#ov").classList.add("on");
                } catch (e) {
                    toast("!");
                }
            });
            $("#catbtn").addEventListener("click", function () {
                gtag("event", "cat_support_click", {
                    flower_result: result,
                });

                $("#catov").classList.add("on");
            });
            $("#catclose").addEventListener("click", function () {
                $("#catov").classList.remove("on");
            });
            $("#catov").addEventListener("click", function (e) {
                if (e.target.id === "catov") $("#catov").classList.remove("on");
            });
            document.addEventListener("keydown", function (e) {
                if (e.key === "Escape") $("#catov").classList.remove("on");
            });
            $("#ovclose").addEventListener("click", function () {
                $("#ov").classList.remove("on");
            });
            $("#ov").addEventListener("click", function (e) {
                if (e.target.id === "ov") $("#ov").classList.remove("on");
            });

            applyLang();

            let lastTouchTime = 0;
            document.addEventListener(
                "touchend",
                (event) => {
                    const currentTime = new Date().getTime();
                    const tapLength = currentTime - lastTouchTime;

                    // If two taps occur within 300ms, prevent the double-tap zoom
                    if (tapLength < 300 && tapLength > 0) {
                        event.preventDefault();
                    }
                    lastTouchTime = currentTime;
                },
                { passive: false },
            );
        </script>
    </body>
</html>
